[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascia"
version = "0.1.0"
description = "Autonomous Self-Healing Cloud Infrastructure Agent"
readme = "README.md"
authors = [{name = "ASCIA Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.8",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["backend", "connectors", "frontend"]
include-package-data = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"backend/api/*" = ["S104"]
"tests/*" = ["S101"]
